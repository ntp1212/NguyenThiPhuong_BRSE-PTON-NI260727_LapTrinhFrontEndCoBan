<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>My Store</h1>
    </header>
    <main>
        <!-- ex1 -->
        <table border="2" cellspacing="8" cellpadding="8">
            <thead>
                <tr>
                    <th>Item Photo</th>
                    <th>Name</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c4/Orange-Fruit-Pieces.jpg" alt="Hinh qua cam" width="200px"/>
                </td>
                <td>Oranges</td>
                <td>$1 ea.</td>
                </tr>
                  <tr>
                    <td>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Singlef.jpg" alt="Hinh qua cam" width="200px"/>
                </td>
                <td>Bananas</td>
                <td>$0.75/lb</td>
                </tr>
                  <tr>
                    <td>
                    <img src="https://greenpress.ca/wp-content/uploads/2025/11/Pomegranate-background.jpg" alt="" width="200px"/>
                </td>
                <td>Pomegranates</td>
                <td>3 for $5</td>
                </tr>
                  <tr>
                    <td>
                    <img src="" alt="Hinh qua cam" width="200px"/>
                </td>
                <td>Gummy Bears</td>
                <td>$6 per bag</td>
                </tr>
                  <tr>
                    <td>
                    <img src="https://veritablevegetable.com/wp-content/uploads/2023/01/fresh-green-broccoli-macro-photo-top-view-scaled.jpg" alt="" width="200px"/>
                </td>
                <td>Broccoli</td>
                <td>$3 a head</td>
                </tr>

            </tbody>
        </table>
        <!-- ex2 -->
        <form action="www.myform">
            <h1>Booking Form</h1>
            <label for="name" >Name:</label>
            <input type="text" id="name" style="margin: 10px;"> <br>
            <label for="email" >Email:</label>
            <input type="email" id="email" style="margin: 10px;"/><br>
            <label for="phone" >Phone:</label>
            <input type="tel" id="phone" style="margin: 10px;"/> <br>
            <label for="date" >Date:</label>
            <input type="date" id="date" style="margin: 10px;"/> <br>
            <label for="time" >Time:</label>
            <input type="time" id="time" style="margin: 10px;"/> <br>
            <label for="guest" >Number of Guest:</label>
            <input type="number" id="guest" style="margin: 10px;"/> <br>
            <button>Submit</button>
        </form>
        <!-- ex3 -->
        <form action="www.myform">
            <h1>Car Purchase Form</h1>
            <label for="name" >Name:</label>
            <input type="text" id="name" style="margin: 10px;"> <br>
            <label for="email" >Email:</label>
            <input type="email" id="email" style="margin: 10px;"/><br>
            <label for="phone" >Phone:</label>
            <input type="tel" id="phone" style="margin: 10px;"/> <br>
            <label for="choose" >Choose a Car:</label>
            <select name="car_type" id="choose" style="margin: 10px;">
                <option value="md1">Model 1</option>
                <option value="md2">Model 2</option>
                <option value="md3">Model 3</option>
                <option value="md4">Model 4</option>
                <option value="md5">Model 5</option>
            </select> <br>
            <label for="choose" >Choose a Color:</label>
            <select name="color" id="color" style="margin: 10px;">
                <option value="c1">Model 1</option>
                <option value="c2">Model 2</option>
                <option value="c3">Model 3</option>
                <option value="c4">Model 4</option>
                <option value="c5">Model 5</option>
            </select> <br>
            <label for="quantity" >Quantity:</label>
            <input type="text" id="quantity" style="margin: 10px;"/> <br>
            <label for="delivery" >Number of Guest:</label>
            <input type="date" id="delivery" style="margin: 10px;"/> <br>
            <button>Submit</button>
        </form>
    </main>
</body>
</html>
