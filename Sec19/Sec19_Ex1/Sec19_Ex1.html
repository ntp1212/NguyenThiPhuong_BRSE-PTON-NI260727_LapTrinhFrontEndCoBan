<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Form</title>
    <link rel="stylesheet" href="./Sec19_Ex1.css" />
  </head>
  <body>
    <div class="register-container">
      <h1 class="register-title">Register</h1>

      <form id="form">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
          />
          <div class="mess" id="mess-email"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
          <div class="mess" id="mess-pass"></div>

        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirm-password">Confirm Password:</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Enter your confirm password"
          />
          <div class="mess" id="mess-confirm"></div>

        </div>

        <!-- Submit Button -->
        <button id="submit-btn" type="submit" class="register-btn">Register</button>
      </form>
    </div>
    <script src="./Sec19_Ex1.js"></script>
  </body>
</html>
