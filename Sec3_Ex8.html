<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        main{
            width: 400px;
        }
        h1{
            margin: 10px;
        }
        .box{
            margin: 10px;
        }
        .rong{
            height: 50px;
            width: 100%;
        }
    </style>
  </head>
  <body>
    <main>
      <form action="www.myform.com.vn">
        <h1>Liên hệ với chúng tôi</h1>
        <div class="box">
          <label for="">Họ và tên:</label><br />
          <input type="text" /><br />
        </div>
        <div class="box">
          <label for="">Email:</label><br />
          <input type="br" />
        </div>
        <div class="box">
          <label for="">Tin nhắn:</label><br />
          <input type="br" class="rong"/>
        </div>
        <button class="box">Gửi</button>
      </form>
    </main>
  </body>
</html>
