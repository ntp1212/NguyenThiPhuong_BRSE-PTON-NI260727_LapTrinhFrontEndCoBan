<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            background-color: rgba(250, 230, 140, 0.507);
            width: 500px;
            padding: 15px;
        }
        h1{
            color: blue;
            padding: 10px;
            text-align: center;
            margin: 10px;
        }
        p{
            padding: 10px;
            text-align: center;
            margin: 10px;
        }
        button{
            margin: 10px;
            padding: 5px;
            border: 1px solid black;
        }
        button:hover{
            color: white;
            background-color: green;
            border: 2px solid black; 
            text-align: center;
        }
        div{
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <main>
        <h1>Trích dẫn nổi bật</h1>
        <p>
            "Kiến thức là sức mạnh"
        </p>
        <div>
            <button>Đọc thêm</button>
        </div>
    </main>
</body>
</html>
