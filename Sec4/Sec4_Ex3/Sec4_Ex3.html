<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            color: black;
            margin: 10px;
        }
        button{
            display: block;
            width: 100%;
            color: white;
            background-color: green;
            border: 0;
            height: 40px;
        }
        lable{
            display: block;
        }
        input{
            width: 100%;
        }
        b{
            margin: 0;
        }
        .mes{
            height: 70px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Liên hệ với chúng tôi</h1>
        <form action="www.myform.com.vn">
            <div>
                <lable for="name"><b>Họ và tên:</b></lable>
                <input type="text" id="name">
            </div>
            <div>
                <lable for="email"><b>Email:</b></lable>
                <input type="text" id="email">
            </div>
            <div>
                <lable for="mes" ><b>Tin nhắn:</b></lable>
                <input type="text" id="mes" class="mes">
            </div>
            <div>
                <button>Gửi</button>
            </div>
        </form>
    </main>
</body>
</html>
